include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Turn off all errors for now to get APK building
    missing_return: ignore
    dead_code: ignore
    unused_local_variable: ignore
    unused_import: ignore
    unused_element: ignore
    override_on_non_overriding_member: ignore
    non_constant_identifier_names: ignore
    prefer_const_constructors: ignore
    prefer_const_constructors_in_immutables: ignore
    prefer_const_literals_to_create_immutables: ignore
    avoid_print: ignore
    use_super_parameters: ignore
    prefer_final_fields: ignore
    prefer_initializing_formals: ignore
    unnecessary_const: ignore
    unnecessary_new: ignore
    unnecessary_this: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_string_interpolations: ignore
    unnecessary_parenthesis: ignore
    unnecessary_nullable_for_final_variable_declarations: ignore
    no_leading_underscores_for_local_identifiers: ignore
    use_build_context_synchronously: ignore
    dangling_library_doc_comments: ignore
    prefer_single_quotes: ignore
    sort_child_properties_last: ignore

linter:
  rules:
    prefer_const_constructors: false
    prefer_const_declarations: false
    avoid_print: false
    prefer_single_quotes: false
    sort_child_properties_last: false
    use_build_context_synchronously: false
