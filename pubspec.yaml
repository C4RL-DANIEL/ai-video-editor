name: ai_video_editor
description: AI Video Editing & Content Repurposing Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation & State
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.4.0
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  gap: ^3.0.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  percent_indicator: ^4.2.3
  dotted_border: ^2.1.0
  
  # File Handling
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Networking
  dio: ^5.4.1
  connectivity_plus: ^6.0.2
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Video & Media
  video_player: ^2.8.3
  chewie: ^1.8.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  collection: ^1.18.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  google_sign_in: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.6
  phosphor_flutter: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  freezed: ^2.5.0
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
